name: Keep Render API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-render-api-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request backend health endpoint
        run: >-
          curl --fail --silent --show-error --location
          --max-time 90
          https://nexora-ai-api-mqqk.onrender.com/health
