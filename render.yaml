services:
  - type: web
    name: nexora-ai-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/hosted/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXORA_HOSTED_FREE
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: PORT
        value: "10000"
      - key: FRONTEND_URLS
        value: https://nexora-frontend-beta.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nexora-cache
          property: connectionString
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: /etc/secrets/serviceAccountKey.json
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_IMAGE_MODEL
        value: gemini-3.1-flash-lite-image
      - key: GEMINI_IMAGE_FALLBACK_ENABLED
        value: "false"
      - key: TAVILY_API_KEY
        sync: false
      - key: IMAGE_KIT_PRIVATE_KEY
        sync: false
      - key: NEXORA_LOCAL_IMAGE_TOKEN
        sync: false

  - type: keyvalue
    name: nexora-cache
    plan: free
    region: singapore
    ipAllowList: []
